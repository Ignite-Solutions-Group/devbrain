name: devbrain
hooks:
  postprovision:
    shell: pwsh
    run: ./scripts/complete-container-app-provision.ps1
    interactive: false
    continueOnError: false
services:
  api:
    project: src/DevBrain.Functions
    language: dotnet
    host: function
  server:
    project: .
    language: docker
    host: containerapp
    apiVersion: 2024-03-01
    docker:
      path: src/DevBrain.Server/Dockerfile
      context: .
      remoteBuild: true
